<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="application-name" content="soulove" />
    <meta name="theme-color" content="#fff1f2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>soulove</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var appRaw = localStorage.getItem('romantic-site-appearance');
          if (appRaw) {
            var app = JSON.parse(appRaw);
            var isDark = app && app.mode === 'dark';
            if (isDark) {
              root.classList.add('dark');
            } else {
              root.classList.remove('dark');
            }
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) {
              metaTheme.setAttribute('content', isDark ? '#110a18' : '#fff1f2');
            }
          }
          var raw = localStorage.getItem('romantic-site-theme-vars');
          if (raw) {
            var vars = JSON.parse(raw);
            for (var key in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, key)) {
                root.style.setProperty(key, vars[key]);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
